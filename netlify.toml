# Netlify configuration for WeatherNow (static site — no build step)

[build]
  publish = "."        # Deploy everything from the repo root

[build.environment]
  NODE_VERSION = "20"  # Not strictly needed but good practice

# Redirect all routes to index.html (SPA-friendly)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# Cache static assets aggressively
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML briefly so updates propagate quickly
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
