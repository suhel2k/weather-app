name: 🚀 Deploy WeatherNow to Netlify

# Trigger on every push to main + pull requests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Validate files (lint / structure check)
  # ─────────────────────────────────────────────
  validate:
    name: ✅ Validate Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f index.html && echo "✅ index.html found"    || (echo "❌ index.html missing" && exit 1)
          test -f style.css  && echo "✅ style.css found"     || (echo "❌ style.css missing"  && exit 1)
          test -f app.js     && echo "✅ app.js found"        || (echo "❌ app.js missing"     && exit 1)
          test -f netlify.toml && echo "✅ netlify.toml found" || (echo "❌ netlify.toml missing" && exit 1)
          echo "All required files present!"

      - name: Validate HTML structure
        run: |
          echo "Checking index.html for key elements..."
          grep -q '<title>'       index.html && echo "✅ Title tag found"
          grep -q 'meta.*description' index.html && echo "✅ Meta description found"
          grep -q 'cityInput'     index.html && echo "✅ Search input found"
          grep -q 'weatherContent' index.html && echo "✅ Weather content section found"
          echo "HTML structure validated!"

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to Netlify
  # ─────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to Netlify
    runs-on: ubuntu-latest
    needs: validate   # Only deploy if validation passes

    # Skip deploy on pull requests — only deploy on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '.'
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
